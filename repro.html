<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reproductor Móvil - Spotify Theme</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Contenedor principal estilo app móvil de Spotify */
        .mobile-app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 890px;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        @media (min-width: 480px) {
            .mobile-app-container {
                border-radius: 24px;
                height: 92vh;
                border: 1px solid #282828;
            }
        }

        /* Barra superior estilo Spotify */
        .mobile-header {
            background-color: #121212;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            z-index: 10;
        }

        /* Selector de géneros (Filtros tipo Spotify) */
        .genre-scroll {
            display: flex;
            gap: 8px;
            padding: 4px 16px 12px 16px;
            background-color: #121212;
            overflow-x: auto;
            flex-shrink: 0;
            scrollbar-width: none;
            z-index: 10;
        }
        .genre-scroll::-webkit-scrollbar { display: none; }

        .genre-btn {
            background: #2a2a2a;
            color: #ffffff;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .genre-btn:hover {
            background: #333333;
        }
        .genre-btn.active {
            background-color: #ffffff;
            color: #000000;
            font-weight: 600;
        }

        /* Sección Central: Reproductor Activo */
        .player-hero {
            padding: 12px 20px;
            background: linear-gradient(180deg, #242424 0%, #121212 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        .album-art-container {
            width: 150px;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            margin-bottom: 14px;
            position: relative;
            background-color: #282828;
        }

        .album-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        /* Controles de reproducción */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 280px;
            margin-top: 8px;
        }

        .control-icon-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
            padding: 8px;
        }
        .control-icon-btn:hover { color: #ffffff; }
        .control-icon-btn:active { transform: scale(0.9); }
        
        .control-icon-btn.play-main {
            background-color: #1DB954;
            color: #000000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.4);
            transition: transform 0.1s, background-color 0.2s;
        }
        .control-icon-btn.play-main:hover {
            background-color: #1ed760;
            transform: scale(1.05);
            color: #000000;
        }

        .control-icon-btn.active-shuffle {
            color: #1DB954;
        }

        /* Lista de canciones */
        .playlist-section {
            flex-grow: 1;
            overflow-y: auto;
            background-color: #121212;
            padding: 4px 12px;
            scroll-behavior: smooth;
        }
        .playlist-section::-webkit-scrollbar { width: 6px; }
        .playlist-section::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }

        .song-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 2px;
        }
        .song-card:hover { background-color: rgba(255, 255, 255, 0.05); }
        .song-card.active {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Footer de la app móvil */
        .mobile-footer {
            background-color: #181818;
            border-top: 1px solid #282828;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .volume-slider {
            width: 90px;
            height: 4px;
            -webkit-appearance: none;
            background: #4d4d4d;
            border-radius: 2px;
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
        }

        @keyframes spotify-pulse {
            0% { box-shadow: 0 0 10px rgba(29, 185, 84, 0.3); }
            50% { box-shadow: 0 0 25px rgba(29, 185, 84, 0.7); }
            100% { box-shadow: 0 0 10px rgba(29, 185, 84, 0.3); }
        }
        .is-playing-glow {
            animation: spotify-pulse 2s infinite;
        }
    </style>
</head>
<body>

    <div class="mobile-app-container">
        
        <!-- HEADER MÓVIL ESPOTIFY -->
        <div class="mobile-header">
            <div class="flex items-center gap-2">
                <i class="fab fa-spotify text-[#1DB954] text-2xl"></i>
                <span class="font-bold text-base text-white tracking-tight">Spotify</span>
            </div>
            <!-- Reloj y Fecha México -->
            <div class="flex flex-col items-end text-right">
                <div id="mexico-time" class="text-xs font-bold text-[#1DB954] leading-none">00:00:00 p. m.</div>
                <div id="mexico-date" class="text-[9px] text-[#b3b3b3] mt-0.5">00/00/0000</div>
            </div>
        </div>

        <!-- SELECTOR DE GÉNEROS (Filtros estilo Spotify) -->
        <div class="genre-scroll">
            <button class="genre-btn active" id="btn-banda" onclick="switchGenreView('banda')">
                <i class="fas fa-hat-cowboy"></i> Banda
            </button>
            <button class="genre-btn" id="btn-salsa" onclick="switchGenreView('salsa')">
                <i class="fas fa-music"></i> Salsa
            </button>
            <button class="genre-btn" id="btn-trova" onclick="switchGenreView('trova')">
                <i class="fas fa-guitar"></i> Trova
            </button>
            <button class="genre-btn" id="btn-sadcore" onclick="switchGenreView('sadcore')">
                <i class="fas fa-heart-broken"></i> Sadcore
            </button>
        </div>

        <!-- REPRODUCTOR HERO (Portada y controles principales) -->
        <div class="player-hero">
            <div class="album-art-container" id="art-container">
                <img src="" id="player-img" class="album-art" alt="Portada Álbum">
            </div>
            
            <div class="flex justify-between items-center w-full px-1 mb-2">
                <div class="truncate pr-2">
                    <div id="player-title" class="font-bold text-sm text-white truncate">Selecciona una pista</div>
                    <div id="player-artist" class="text-xs text-[#b3b3b3] truncate mt-0.5">Playlist lista</div>
                </div>
                <button class="control-icon-btn text-base" onclick="toggleFavorite()" title="Guardar">
                    <i class="far fa-heart" id="fav-icon"></i>
                </button>
            </div>

            <!-- Tiempos de reproducción -->
            <div class="flex justify-between w-full text-[10px] text-[#b3b3b3] font-mono mb-1 px-1">
                <span id="player-current-time">0:00</span>
                <span id="player-total-time">0:00</span>
            </div>

            <!-- Controles de Pista -->
            <div class="controls-row">
                <button class="control-icon-btn" onclick="toggleAutoplay()" id="btn-autoplay" title="Aleatorio">
                    <i class="fas fa-random text-sm"></i>
                </button>
                <button class="control-icon-btn text-xl" onclick="playPrevious()" title="Anterior">
                    <i class="fas fa-step-backward"></i>
                </button>
                <button class="control-icon-btn play-main" onclick="togglePlay()" title="Reproducir / Pausa">
                    <i class="fas fa-play text-black ml-0.5" id="bar-play-icon"></i>
                </button>
                <button class="control-icon-btn text-xl" onclick="playNext()" title="Siguiente">
                    <i class="fas fa-step-forward"></i>
                </button>
                <button class="control-icon-btn text-sm" onclick="toggleLoop()" title="Repetir">
                    <i class="fas fa-redo text-sm"></i>
                </button>
            </div>
        </div>

        <!-- LISTA DE CANCIONES -->
        <div id="song-list" class="playlist-section">
            <!-- Las canciones se inyectan dinámicamente -->
        </div>

        <!-- FOOTER / HERRAMIENTAS ADICIONALES -->
        <div class="mobile-footer">
            <div class="flex items-center gap-2">
                <i class="fab fa-spotify text-[#1DB954] text-lg"></i>
                <span class="text-[11px] font-semibold text-white tracking-wider">Spotify Premium</span>
            </div>

            <!-- Control de Volumen Compacto -->
            <div class="flex items-center gap-2 bg-[#282828] px-3 py-1.5 rounded-full">
                <button class="control-icon-btn text-xs p-0 text-[#b3b3b3] hover:text-white" onclick="toggleMute()">
                    <i class="fas fa-volume-up" id="volume-icon"></i>
                </button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.7" oninput="changeVolume(this.value)">
            </div>
        </div>

    </div>

                    { title: "No Te Cambio", artist: "Alejandro Filio", time: "3:45", url: "https://www.dropbox.com/scl/fi/xoac93ufssvcpylgtsn4k/No-te-cambio-Alejandro-Filio.mp3?rlkey=s7rs7hm0nj9km45c3tpbfpdx0&raw=1" },
                    { title: "Sigo Amándote", artist: "Edgar Oceransky", time: "3:50", url: "https://www.dropbox.com/scl/fi/ml2mvx64mgfdmiyqnm7zf/Sigo-Am-ndote.mp3?rlkey=wrkrhntutxr3mzwpgies9uoul&raw=1" },
                    { title: "Últimamente", artist: "Edgar Oceransky", time: "3:35", url: "https://www.dropbox.com/scl/fi/2u612z0z1sq8qo01wyjzx/ltimamente.mp3?rlkey=ommdudl3y7bryd6959yhp5x0y&raw=1" },
                    { title: "Vuelve", artist: "Edgar Oceransky", time: "4:00", url: "https://www.dropbox.com/scl/fi/prdevpjlj3qpbz7tf2j4m/Vuelve.mp3?rlkey=c8hoehwz63gh8t205hrrdq7o0&raw=1" }
                ]
            },
            sadcore: {
                name: "Sadcore",
                image: "https://xatimg.com/image/RNAPuTGrAX16.png",
                songs: [
                    { title: "Contigo Pero Solo", artist: "Sadcore", time: "3:30", url: "https://www.dropbox.com/scl/fi/mcvqdocpc3tck1ifnz4px/Contigo-pero-solo.mp3?rlkey=p9mnbwvqy0g193f66l8x6qvvo&raw=1" },
                    { title: "Cuando Quieres", artist: "Sadcore", time: "3:15", url: "https://www.dropbox.com/scl/fi/jkvd2ewuck1fx28cdkfjg/Cuando-quieres.mp3?rlkey=igx98qozkf00s22amqfrzm7ue&raw=1" },
                    { title: "Estás Pero No", artist: "Sadcore", time: "3:20", url: "https://www.dropbox.com/scl/fi/2800epy3qigrf5t1s5xs7/Est-s-pero-no.mp3?rlkey=i9xsimiexr4mc4b077vj3osqg&raw=1" },
                    { title: "Lagos & Reik", artist: "Lagos & Reik", time: "3:10", url: "https://www.dropbox.com/scl/fi/mljhdpp4a3dnkadqov43y/Lagos-Reik.mp3?rlkey=unq2bfmidqt3itx8wx3kf8f36&raw=1" },
                    { title: "Te Di De Más", artist: "Sadcore", time: "3:40", url: "https://www.dropbox.com/scl/fi/926b0wn6n25hfq1ly7tf3/Te-di-de-m-s.mp3?rlkey=yq0mwcgrjsu3kchafrcc4j5ip&raw=1" },
                    { title: "Tú Ya No", artist: "Sadcore", time: "3:05", url: "https://www.dropbox.com/scl/fi/sqatlt6kofd4w6zcbobk4/T-ya-no.mp3?rlkey=oxpwf2p3p61zuz4k8pdq6wag1&raw=1" },
                    { title: "Vives En Ayer", artist: "Sadcore", time: "3:25", url: "https://www.dropbox.com/scl/fi/lfy0ykgvhb9uzmujkp98k/Vives-en-ayer.mp3?rlkey=0cymbrqq0fapwgooy5v5gstw5&raw=1" }
                ]
            }
        };

        let currentGenreView = 'banda'; 
        let playingGenre = 'banda';      
        let currentSongIndex = 0;        
        let playingSongIndex = 0;        
        let isPlaying = false;
        let isAutoplay = false; 
        let isLooping = false;
        let isFavorite = false;
        let playedSongs = new Set();
        
        let globalVolume = 0.7;
        let previousVolume = 0.7;
        let currentlyLoadedSong = null; 

        // Precarga de audios
        for (const genre in musicData) {
            musicData[genre].songs.forEach(song => {
                if (song.url) {
                    song.audio = new Audio(song.url);
                    song.audio.preload = 'auto'; 
                    song.audio.volume = globalVolume;
                    
                    song.audio.addEventListener('timeupdate', () => {
                        if (currentlyLoadedSong === song && song.audio.duration) {
                            document.getElementById('player-current-time').textContent = formatTime(song.audio.currentTime);
                            document.getElementById('player-total-time').textContent = formatTime(song.audio.duration);
                        }
                    });

                    song.audio.addEventListener('ended', handleSongEnded);
                }
            });
        }

        window.onload = () => {
            switchGenreView('banda');
            updateMexicoClock();
            setInterval(updateMexicoClock, 1000);
        };
        
        function updateMexicoClock() {
            const now = new Date();
            const timeOptions = { timeZone: 'America/Mexico_City', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
            const dateOptions = { timeZone: 'America/Mexico_City', day: '2-digit', month: '2-digit', year: 'numeric' };
            
            const timeStr = new Intl.DateTimeFormat('es-MX', timeOptions).format(now);
            const dateStr = new Intl.DateTimeFormat('es-MX', dateOptions).format(now);
            
            const timeEl = document.getElementById('mexico-time');
            const dateEl = document.getElementById('mexico-date');
            if (timeEl) timeEl.textContent = timeStr.toLowerCase();
            if (dateEl) dateEl.textContent = dateStr;
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function handleSongEnded() {
            if (isLooping && currentlyLoadedSong) {
                currentlyLoadedSong.audio.currentTime = 0;
                currentlyLoadedSong.audio.play();
                return;
            }
            if (isAutoplay) {
                playRandomNext();
            } else {
                playNextLooping(); 
            }
            startPlayingSelected();
        }

        function toggleAutoplay() {
            isAutoplay = !isAutoplay;
            const btn = document.getElementById('btn-autoplay');
            if (isAutoplay) {
                btn.classList.add('active-shuffle');
                playedSongs.clear(); 
                playedSongs.add(playingSongIndex);
            } else {
                btn.classList.remove('active-shuffle');
            }
        }

        function toggleLoop() {
            isLooping = !isLooping;
            const btn = event.currentTarget;
            if (isLooping) {
                btn.style.color = '#1DB954';
            } else {
                btn.style.color = '#b3b3b3';
            }
        }

        function toggleFavorite() {
            isFavorite = !isFavorite;
            const icon = document.getElementById('fav-icon');
            if (isFavorite) {
                icon.className = "fas fa-heart text-[#1DB954]";
            } else {
                icon.className = "far fa-heart text-[#b3b3b3]";
            }
        }

        function playRandomNext() {
            const data = musicData[playingGenre];
            if (playedSongs.size >= data.songs.length) {
                playedSongs.clear();
            }
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * data.songs.length);
            } while (playedSongs.has(randomIndex) && data.songs.length > 1);
            
            playedSongs.add(randomIndex);
            playingSongIndex = randomIndex;
            if (currentGenreView === playingGenre) currentSongIndex = randomIndex;
            
            selectAndPlaySong(playingGenre, playingSongIndex);
        }

        function playNextLooping() {
            const data = musicData[playingGenre];
            let nextIndex = playingSongIndex + 1;
            if (nextIndex >= data.songs.length) nextIndex = 0; 
            selectAndPlaySong(playingGenre, nextIndex);
        }

        function switchGenreView(genreId) {
            currentGenreView = genreId;
            currentSongIndex = (playingGenre === genreId) ? playingSongIndex : 0;
            
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById(`btn-${genreId}`);
            if (btn) btn.classList.add('active');

            const data = musicData[genreId];
            const song = data.songs[currentSongIndex];
            
            if (playingGenre !== genreId || !isPlaying) {
                document.getElementById('player-title').textContent = song.title;
                document.getElementById('player-artist').textContent = song.artist;
                document.getElementById('player-img').src = data.image;
                document.getElementById('player-current-time').textContent = "0:00";
                document.getElementById('player-total-time').textContent = song.time;
            }

            renderSongList();
        }

        function selectSongToPlay(genreId, index) {
            playingGenre = genreId;
            playingSongIndex = index;
            currentGenreView = genreId;
            currentSongIndex = index;

            const data = musicData[genreId];
            const song = data.songs[index];
            
            document.getElementById('player-title').textContent = song.title;
            document.getElementById('player-artist').textContent = song.artist;
            document.getElementById('player-img').src = data.image;
            document.getElementById('player-total-time').textContent = song.time;

            renderSongList();
            
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById(`btn-${genreId}`);
            if (btn) btn.classList.add('active');
        }

        function renderSongList() {
            const data = musicData[currentGenreView];
            const songListContainer = document.getElementById('song-list');
            songListContainer.innerHTML = ''; 

            data.songs.forEach((song, index) => {
                const isSelected = (currentGenreView === playingGenre && index === playingSongIndex);
                
                const songHtml = `
                    <div class="song-card ${isSelected ? 'active' : ''}" onclick="selectAndPlaySong('${currentGenreView}', ${index})">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <div class="w-6 text-center text-xs font-bold text-[#b3b3b3]">
                                ${isSelected && isPlaying ? '<i class="fas fa-volume-high text-[#1DB954] animate-pulse"></i>' : (index + 1)}
                            </div>
                            <div class="flex flex-col truncate">
                                <span class="text-xs font-semibold ${isSelected ? 'text-[#1DB954]' : 'text-white'} truncate">${song.title}</span>
                                <span class="text-[10px] text-[#b3b3b3] truncate mt-0.5">${song.artist}</span>
                            </div>
                        </div>
                        <div class="text-xs font-mono text-[#b3b3b3] pl-2">${song.time}</div>
                    </div>
                `;
                songListContainer.innerHTML += songHtml;
            });
        }

        function togglePlay() {
            if (isPlaying) {
                if (currentlyLoadedSong && currentlyLoadedSong.audio) {
                    currentlyLoadedSong.audio.pause();
                }
                isPlaying = false;
            } else {
                if (!currentlyLoadedSong || playingGenre !== currentGenreView) {
                    selectSongToPlay(currentGenreView, currentSongIndex);
                }
                startPlayingSelected();
            }
            updatePlayUI();
        }
        
        function startPlayingSelected() {
            const data = musicData[playingGenre];
            const song = data.songs[playingSongIndex];
            playedSongs.add(playingSongIndex); 

            const isNewSong = (currentlyLoadedSong !== song);

            if (isNewSong) {
                if (currentlyLoadedSong && currentlyLoadedSong.audio) {
                    currentlyLoadedSong.audio.pause();
                    currentlyLoadedSong.audio.currentTime = 0; 
                }
                currentlyLoadedSong = song;
            }

            if (song.audio) {
                song.audio.play().catch(e => console.log("Audio play prevented:", e));
            }
            isPlaying = true;
            updatePlayUI();
        }

        function selectAndPlaySong(genreId, index) {
            selectSongToPlay(genreId, index);
            startPlayingSelected();
        }

        function playNext() {
            if (currentlyLoadedSong && currentlyLoadedSong.audio) currentlyLoadedSong.audio.pause();
            const data = musicData[playingGenre];
            let nextIndex = playingSongIndex + 1;
            if (nextIndex >= data.songs.length) nextIndex = 0; 
            selectAndPlaySong(playingGenre, nextIndex);
            startPlayingSelected();
        }

        function playPrevious() {
            if (currentlyLoadedSong && currentlyLoadedSong.audio) currentlyLoadedSong.audio.pause();
            const data = musicData[playingGenre];
            let prevIndex = playingSongIndex - 1;
            if (prevIndex < 0) prevIndex = data.songs.length - 1; 
            selectAndPlaySong(playingGenre, prevIndex);
            startPlayingSelected();
        }

        function updatePlayUI() {
            const iconClass = isPlaying ? 'fa-pause' : 'fa-play';
            document.getElementById('bar-play-icon').className = `fas ${iconClass} text-black ml-0.5`;
            
            const artContainer = document.getElementById('art-container');
            if(isPlaying) {
                artContainer.classList.add('is-playing-glow');
            } else {
                artContainer.classList.remove('is-playing-glow');
            }
            renderSongList();
        }

        function changeVolume(val) {
            globalVolume = parseFloat(val);
            for (const genre in musicData) {
                musicData[genre].songs.forEach(song => {
                    if (song.audio) song.audio.volume = globalVolume;
                });
            }
            const icon = document.getElementById('volume-icon');
            if (globalVolume === 0) {
                icon.className = "fas fa-volume-mute text-[#b3b3b3]";
            } else if (globalVolume < 0.4) {
                icon.className = "fas fa-volume-down text-[#b3b3b3]";
            } else {
                icon.className = "fas fa-volume-up text-[#b3b3b3]";
            }
        }

        function toggleMute() {
            const slider = document.getElementById('volume-slider');
            if (parseFloat(slider.value) > 0) {
                previousVolume = slider.value;
                slider.value = 0;
                changeVolume(0);
            } else {
                slider.value = previousVolume;
                changeVolume(previousVolume);
            }
        }
    </script>
</body>
</html>
